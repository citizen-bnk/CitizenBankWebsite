name: Recover brand images
# One-off: fetch the brand images the old platform hosted (from its old address or a web archive) and commit what is
# found to public/brand on this branch. Runs when tools/fetch-brand-images.sh changes.
on:
  push:
    paths: ["tools/fetch-brand-images.sh"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe and download
        run: bash tools/fetch-brand-images.sh found | tee probe.log
      - name: Commit what was found
        run: |
          shopt -s nullglob
          files=(found/*)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing found"; exit 0; fi
          mkdir -p public/brand
          cp found/* public/brand/
          git config user.name "brand-probe"; git config user.email "brand-probe@users.noreply.github.com"
          git add public/brand
          git commit -m "Recovered brand images from the old platform's address or a web archive" || exit 0
          git push
